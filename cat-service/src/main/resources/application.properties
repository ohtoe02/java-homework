# Настройки приложения
spring.application.name=cat-service

# Настройки базы данных PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/catbot
spring.datasource.username=catbot
spring.datasource.password=password

# JPA настройки
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway миграции
spring.flyway.locations=classpath:db/migration

# Настройки Kafka
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=cat-service-group
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*

# Топики
kafka.topic.commands=cat-commands
kafka.topic.events=cat-events
kafka.topic.responses=cat-responses 